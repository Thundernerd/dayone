name: Release

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  # GHCR image names must be lowercase.
  IMAGE: ghcr.io/thundernerd/dayone

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  publish:
    name: Publish image and release
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v7

      - id: version
        name: Version from tag
        env:
          TAG: ${{ github.ref_name }}
        run: echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

      # Packaged and smoke-tested before anything is published, so a broken
      # archive stops the release before the image is pushed.
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      # Builds without Twitch credentials; the server reads them at runtime.
      - name: Build and package the server archive
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: scripts/package-release.sh "$VERSION"

      - name: Smoke-test the server archive
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: scripts/smoke-test-release.sh "dist/dayone-$VERSION.tar.gz"

      # Checks the runtime credential path against IGDB before anything is
      # published. The secrets are set only here, never on the build.
      - name: Smoke-test the server archive with Twitch credentials
        env:
          VERSION: ${{ steps.version.outputs.version }}
          TWITCH_CLIENT_ID: ${{ secrets.TWITCH_CLIENT_ID }}
          TWITCH_CLIENT_SECRET: ${{ secrets.TWITCH_CLIENT_SECRET }}
        run: |
          if [[ -z "$TWITCH_CLIENT_ID" || -z "$TWITCH_CLIENT_SECRET" ]]; then
            echo "::notice title=Credentialed smoke test skipped::The TWITCH_CLIENT_ID and TWITCH_CLIENT_SECRET secrets are not available to this run."
            exit 0
          fi
          scripts/smoke-test-release.sh --with-credentials "dist/dayone-$VERSION.tar.gz"

      - uses: docker/setup-qemu-action@v4

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          # v1.2.3 -> 1.2.3, 1.2, 1, latest. Pre-releases (v1.2.3-rc.1) only get their exact tag.
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}

      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          archive="dist/dayone-${VERSION}.tar.gz"
          node_major="$(cat .nvmrc)"
          prerelease=()
          if [[ "$VERSION" == *-* ]]; then
            prerelease=(--prerelease)
          fi

          cat > notes.md <<EOF
          Docker image:

          \`\`\`sh
          docker pull ${IMAGE}:${VERSION}
          \`\`\`

          Server archive (\`dayone-${VERSION}.tar.gz\`), for running without Docker. It needs
          Node ${node_major} and nothing else, on any architecture:

          \`\`\`sh
          sha256sum -c dayone-${VERSION}.tar.gz.sha256
          tar -xzf dayone-${VERSION}.tar.gz
          cd dayone-${VERSION}
          PORT=3000 TWITCH_CLIENT_ID=… TWITCH_CLIENT_SECRET=… node server/index.mjs
          \`\`\`
          EOF

          # --generate-notes appends GitHub's changelog after notes.md.
          gh release create "$TAG" \
            --verify-tag \
            --generate-notes \
            "${prerelease[@]}" \
            --notes-file notes.md \
            "$archive" "$archive.sha256"
