name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Lets the release workflow run the same checks before publishing.
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    name: Typecheck and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - run: npm run typecheck

      # Runs `npm run build` (without Twitch credentials) and packs the release archive.
      - name: Build and package the server archive
        run: scripts/package-release.sh 0.0.0-ci

      - name: Smoke-test the server archive
        run: scripts/smoke-test-release.sh dist/dayone-0.0.0-ci.tar.gz

      # Checks the runtime credential path against IGDB. The secrets are set only
      # here, never on the build. Fork and Dependabot PRs get no secrets, and
      # neither does this workflow when release.yml calls it, so it skips there.
      - name: Smoke-test the server archive with Twitch credentials
        env:
          TWITCH_CLIENT_ID: ${{ secrets.TWITCH_CLIENT_ID }}
          TWITCH_CLIENT_SECRET: ${{ secrets.TWITCH_CLIENT_SECRET }}
        run: |
          if [[ -z "$TWITCH_CLIENT_ID" && -z "$TWITCH_CLIENT_SECRET" ]]; then
            echo "::notice title=Credentialed smoke test skipped::The TWITCH_CLIENT_ID and TWITCH_CLIENT_SECRET secrets are not available to this run."
            exit 0
          fi
          scripts/smoke-test-release.sh --with-credentials dist/dayone-0.0.0-ci.tar.gz

  lint:
    name: Lint workflows and scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # The image bundles shellcheck, so run: blocks are checked too.
      - name: actionlint
        uses: docker://rhysd/actionlint:1.7.12
        with:
          args: -color

      - name: shellcheck
        run: shellcheck scripts/*.sh

      # Picks up deploy/proxmox/.shellcheckrc (the community-scripts checks).
      - name: ShellCheck the Proxmox VE scripts
        working-directory: deploy/proxmox
        run: shellcheck ct/dayone.sh install/dayone-install.sh

      - name: Check the Proxmox VE scripts install the Node major in .nvmrc
        working-directory: deploy/proxmox
        run: |
          node_major="$(tr -d '[:space:]' <../../.nvmrc)"
          for f in ct/dayone.sh install/dayone-install.sh; do
            grep -q "NODE_VERSION=\"${node_major}\" setup_nodejs" "$f" || {
              echo "::error file=deploy/proxmox/$f::installs a different Node major than .nvmrc (${node_major})"
              exit 1
            }
          done

  docker:
    name: Docker build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - name: Build image (not pushed)
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          load: true
          tags: dayone:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Check the image ships the license notices
        run: |
          docker run --rm dayone:ci head -n 1 /app/LICENSE | grep -qx 'MIT License' || {
            echo "::error file=Dockerfile::/app/LICENSE is missing or does not hold the MIT text"
            exit 1
          }
