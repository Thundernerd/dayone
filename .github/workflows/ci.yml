name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Lets the release workflow run the same checks before publishing.
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    name: Typecheck and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - run: npm run typecheck

      # Runs `npm run build` (without Twitch credentials) and packs the release archive.
      - name: Build and package the server archive
        run: scripts/package-release.sh 0.0.0-ci

      - name: Smoke-test the server archive
        run: scripts/smoke-test-release.sh dist/dayone-0.0.0-ci.tar.gz

  lint:
    name: Lint workflows and scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # The image bundles shellcheck, so run: blocks are checked too.
      - name: actionlint
        uses: docker://rhysd/actionlint:1.7.12
        with:
          args: -color

      - name: shellcheck
        run: shellcheck scripts/*.sh

      # Picks up deploy/proxmox/.shellcheckrc (the community-scripts checks).
      - name: ShellCheck the Proxmox VE scripts
        working-directory: deploy/proxmox
        run: shellcheck ct/dayone.sh install/dayone-install.sh

  docker:
    name: Docker build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - name: Build image (not pushed)
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
